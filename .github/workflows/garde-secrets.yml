name: garde-secrets
on: [push, pull_request]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuser les fichiers interdits
        run: |
          if git ls-files | grep -E '^(\.env$|backup/|work/|shots/|traces/|bench-results/|tools/adbkey/)|recovery-.*\.json$'; then
            echo "Fichier interdit dans le depot."
            exit 1
          fi
